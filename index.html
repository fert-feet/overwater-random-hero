<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f4f5">
  <meta name="description" content="守望先锋双英雄转盘：选择重装、输出或辅助职责，一次抽取两名不同英雄。">
  <title>守望先锋双英雄转盘</title>
  <style>
    :root {
      color-scheme: light;
      --background: #f4f4f5;
      --surface: #ffffff;
      --surface-subtle: #fafafa;
      --surface-muted: #f4f4f5;
      --foreground: #18181b;
      --muted-foreground: #71717a;
      --border: #e4e4e7;
      --border-strong: #d4d4d8;
      --primary: #18181b;
      --primary-foreground: #fafafa;
      --accent: #18181b;
      --accent-soft: #f4f4f5;
      --ring: #18181b;
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 14px;
      --shadow-card: 0 22px 60px rgba(24, 24, 27, 0.08), 0 2px 8px rgba(24, 24, 27, 0.04);
      --shadow-wheel: 0 26px 55px rgba(24, 24, 27, 0.2), 0 0 0 1px rgba(24, 24, 27, 0.08);
      --tank: #18181b;
      --damage: #18181b;
      --support: #18181b;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      background: var(--background);
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--foreground);
      background:
        radial-gradient(circle at 8% 4%, rgba(24, 24, 27, 0.055), transparent 28rem),
        radial-gradient(circle at 92% 18%, rgba(24, 24, 27, 0.035), transparent 32rem),
        linear-gradient(180deg, #fafafa 0%, var(--background) 42%);
    }

    button {
      font: inherit;
    }

    button,
    [role="tab"] {
      -webkit-tap-highlight-color: transparent;
    }

    :where(button, [href], [tabindex]):focus-visible {
      outline: 3px solid var(--ring);
      outline-offset: 3px;
    }

    .visually-hidden {
      position: absolute !important;
      clip-path: inset(50%) !important;
      overflow: hidden !important;
      width: 1px !important;
      height: 1px !important;
      margin: -1px !important;
      padding: 0 !important;
      border: 0 !important;
      white-space: nowrap !important;
    }

    .skip-link {
      position: fixed;
      z-index: 100;
      top: 14px;
      left: 14px;
      padding: 10px 14px;
      border-radius: 10px;
      color: var(--primary-foreground);
      background: var(--primary);
      text-decoration: none;
      transform: translateY(-160%);
      transition: transform 160ms ease;
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    main {
      width: min(100% - 40px, 1240px);
      margin: 0 auto;
      padding: 32px 0 40px;
    }

    .result-kicker,
    .seed-label,
    .combo-label {
      display: block;
      color: var(--muted-foreground);
      font-size: 0.66rem;
      font-weight: 750;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .roulette-card {
      overflow: hidden;
      border: 1px solid rgba(212, 212, 216, 0.9);
      border-radius: var(--radius-xl);
      background: rgba(255, 255, 255, 0.9);
      box-shadow: var(--shadow-card);
      backdrop-filter: blur(20px);
    }

    .controls {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      padding: 28px 30px 22px;
    }

    .controls h2 {
      margin: 0;
      font-size: 1.08rem;
      letter-spacing: -0.025em;
    }

    .rounds {
      display: flex;
      flex: none;
      align-items: center;
      gap: 9px;
      color: var(--muted-foreground);
      font-size: 0.72rem;
      font-weight: 650;
      letter-spacing: 0.04em;
    }

    .rounds strong {
      display: grid;
      min-width: 30px;
      height: 30px;
      padding: 0 8px;
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--foreground);
      background: var(--surface);
      font-variant-numeric: tabular-nums;
      place-items: center;
    }

    .role-tabs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 5px;
      margin: 0 30px 30px;
      padding: 5px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface-muted);
    }

    .role-tab {
      position: relative;
      display: flex;
      min-height: 52px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 10px 12px;
      overflow: hidden;
      border: 0;
      border-radius: 11px;
      color: #52525b;
      background: transparent;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 720;
      transition: color 160ms ease, background-color 160ms ease;
    }

    .role-tab::after {
      position: absolute;
      inset: auto 18% 0;
      border-block-end: 2px solid transparent;
      content: "";
    }

    .role-tab:hover {
      color: var(--foreground);
      background: rgba(255, 255, 255, 0.55);
    }

    .role-tab[aria-selected="true"] {
      color: var(--foreground);
      background: var(--surface);
      box-shadow: 0 1px 3px rgba(24, 24, 27, 0.08);
    }

    .role-tab[aria-selected="true"]::after {
      border-color: var(--role-color);
    }

    .role-dot {
      width: 9px;
      height: 9px;
      flex: none;
      border-radius: 50%;
      background: var(--role-color);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--role-color) 12%, transparent);
    }

    .role-count {
      padding-left: 9px;
      border-left: 1px solid var(--border-strong);
      color: var(--muted-foreground);
      font-size: 0.72rem;
      font-variant-numeric: tabular-nums;
    }

    [role="tabpanel"] {
      padding: 0 30px 30px;
    }

    [role="tabpanel"][hidden] {
      display: none;
    }

    .wheel-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .wheel-card {
      min-width: 0;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.98), rgba(250, 250, 250, 0.94));
    }

    .wheel-card-header {
      display: flex;
      min-height: 42px;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .wheel-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .wheel-index {
      display: grid;
      width: 34px;
      height: 34px;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: #52525b;
      background: var(--surface);
      font-size: 0.7rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      place-items: center;
    }

    .wheel-title h3 {
      margin: 0;
      font-size: 0.9rem;
      letter-spacing: -0.015em;
    }

    .mini-spin {
      display: inline-flex;
      min-height: 34px;
      align-items: center;
      gap: 7px;
      padding: 6px 11px;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: #52525b;
      background: var(--surface);
      cursor: pointer;
      font-size: 0.73rem;
      font-weight: 700;
      transition: color 150ms ease, border-color 150ms ease, background-color 150ms ease;
    }

    .mini-spin:hover:not(:disabled) {
      border-color: var(--border-strong);
      color: var(--foreground);
      background: var(--surface-subtle);
    }

    .mini-spin:disabled {
      cursor: wait;
      opacity: 0.52;
    }

    .spin-icon {
      width: 14px;
      height: 14px;
    }

    .is-spinning .spin-icon {
      animation: rotate-icon 900ms linear infinite;
    }

    @keyframes rotate-icon {
      to {
        transform: rotate(360deg);
      }
    }

    .wheel-stage {
      position: relative;
      width: min(100%, 480px);
      margin: 0 auto;
      padding-top: 12px;
    }

    .wheel-stage::before {
      position: absolute;
      inset: 12% 7% 1%;
      border-radius: 50%;
      background: var(--role-color);
      content: "";
      filter: blur(44px);
      opacity: 0.09;
      pointer-events: none;
    }

    .wheel-canvas {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      aspect-ratio: 1;
      border-radius: 50%;
      box-shadow: var(--shadow-wheel);
    }

    .wheel-pointer {
      position: absolute;
      z-index: 4;
      top: 0;
      left: 50%;
      width: 24px;
      height: 34px;
      background: #18181b;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      filter:
        drop-shadow(0 0 1.5px #ffffff)
        drop-shadow(0 5px 8px rgba(24, 24, 27, 0.22));
      transform: translateX(-50%);
    }

    .wheel-pointer::before {
      position: absolute;
      inset: 6px 6px auto;
      height: 4px;
      border-radius: 999px;
      background: #ffffff;
      content: "";
    }

    .wheel-hub {
      position: absolute;
      z-index: 3;
      top: 50%;
      left: 50%;
      display: grid;
      width: 22%;
      min-width: 68px;
      aspect-ratio: 1;
      align-content: center;
      justify-items: center;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 50%;
      color: #fafafa;
      background:
        radial-gradient(circle at 38% 28%, rgba(255, 255, 255, 0.12), transparent 35%),
        #18181b;
      box-shadow: 0 12px 26px rgba(24, 24, 27, 0.35);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .hub-mark {
      position: relative;
      width: 22px;
      height: 22px;
      margin-bottom: 4px;
      border: 1px solid #52525b;
      border-radius: 50%;
    }

    .hub-mark::before,
    .hub-mark::after {
      position: absolute;
      top: 50%;
      left: 50%;
      background: #ffffff;
      content: "";
      transform: translate(-50%, -50%);
    }

    .hub-mark::before {
      width: 10px;
      height: 1px;
    }

    .hub-mark::after {
      width: 1px;
      height: 10px;
    }

    .hub-label {
      color: #a1a1aa;
      font-size: clamp(0.5rem, 1vw, 0.62rem);
      font-weight: 800;
      letter-spacing: 0.16em;
    }

    .result-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-top: 18px;
      padding: 17px 2px 1px;
      border-top: 1px solid var(--border);
    }

    .result-hero {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 12px;
    }

    .result-avatar {
      width: 54px;
      aspect-ratio: 1;
      flex: none;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--role-color) 42%, var(--border));
      border-radius: 15px;
      background: var(--surface-muted);
      box-shadow: 0 6px 16px rgba(24, 24, 27, 0.1);
    }

    .result-avatar img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 160ms ease;
    }

    .result-avatar img.changing {
      opacity: 0.35;
    }

    .result-copy {
      min-width: 0;
    }

    .hero-result {
      max-width: 100%;
      margin: 5px 0 0;
      overflow-wrap: anywhere;
      font-size: clamp(1.35rem, 3.1vw, 2rem);
      font-weight: 790;
      letter-spacing: -0.045em;
      line-height: 1.08;
    }

    .hero-result.changing {
      color: var(--muted-foreground);
      letter-spacing: 0.12em;
    }

    .seed-box {
      flex: none;
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-subtle);
      text-align: right;
    }

    .seed-box code {
      display: block;
      min-width: 60px;
      margin-top: 3px;
      color: #52525b;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.68rem;
      font-weight: 650;
      letter-spacing: 0.04em;
    }

    .action-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin-top: 18px;
      padding: 18px 18px 18px 21px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface-subtle);
    }

    .combo {
      min-width: 0;
    }

    .combo strong {
      display: block;
      margin-top: 5px;
      overflow: hidden;
      font-size: clamp(0.92rem, 2vw, 1.05rem);
      letter-spacing: -0.02em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .primary-button {
      display: inline-flex;
      min-height: 50px;
      flex: none;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 13px 22px;
      border: 1px solid #18181b;
      border-radius: 13px;
      color: var(--primary-foreground);
      background: var(--primary);
      box-shadow: 0 9px 24px rgba(24, 24, 27, 0.16);
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 750;
      transition: background-color 160ms ease, transform 160ms ease, box-shadow 160ms ease;
    }

    .primary-button svg {
      width: 17px;
      height: 17px;
      color: #d4d4d8;
    }

    .primary-button:hover:not(:disabled) {
      background: #27272a;
      box-shadow: 0 12px 30px rgba(24, 24, 27, 0.2);
      transform: translateY(-1px);
    }

    .primary-button:active:not(:disabled) {
      transform: translateY(0);
    }

    .primary-button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .site-footer {
      display: flex;
      width: min(100% - 40px, 1240px);
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin: 0 auto;
      padding: 6px 0 34px;
      color: #a1a1aa;
      font-size: 0.68rem;
      letter-spacing: 0.04em;
    }

    .site-footer p {
      margin: 0;
    }

    .noscript {
      width: min(100% - 40px, 720px);
      margin: 20px auto;
      padding: 16px;
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      color: var(--foreground);
      background: var(--surface);
      text-align: center;
    }

    @media (max-width: 820px) {
      main {
        padding-top: 22px;
      }

      .wheel-grid {
        grid-template-columns: 1fr;
      }

      .wheel-stage {
        width: min(100%, 440px);
      }
    }

    @media (max-width: 600px) {
      main,
      .site-footer {
        width: min(100% - 24px, 1240px);
      }

      main {
        padding-top: 16px;
      }

      .roulette-card {
        border-radius: 22px;
      }

      .controls {
        align-items: flex-start;
        padding: 21px 18px 17px;
      }

      .rounds {
        padding-top: 1px;
      }

      .role-tabs {
        gap: 3px;
        margin: 0 14px 18px;
      }

      .role-tab {
        min-height: 48px;
        gap: 7px;
        padding-inline: 6px;
        font-size: 0.8rem;
      }

      .role-count {
        display: none;
      }

      [role="tabpanel"] {
        padding: 0 12px 12px;
      }

      .wheel-card {
        padding: 13px;
        border-radius: 18px;
      }

      .wheel-card-header {
        margin-bottom: 10px;
      }

      .wheel-stage {
        width: min(100%, 390px);
      }

      .hero-result {
        font-size: 1.45rem;
      }

      .result-avatar {
        width: 48px;
        border-radius: 13px;
      }

      .action-bar {
        align-items: stretch;
        flex-direction: column;
        gap: 14px;
        margin-top: 12px;
        padding: 16px;
      }

      .primary-button {
        width: 100%;
      }

      .site-footer {
        align-items: flex-start;
        flex-direction: column;
        gap: 5px;
        padding-top: 2px;
      }
    }

    @media (pointer: coarse) {
      .mini-spin {
        min-height: 40px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .skip-link,
      .role-tab,
      .mini-spin,
      .primary-button {
        transition-duration: 0ms;
      }

      .is-spinning .spin-icon {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">跳到转盘</a>

  <main id="main-content" tabindex="-1">
    <h1 class="visually-hidden">守望先锋双英雄转盘</h1>

    <section class="roulette-card" aria-labelledby="roulette-title">
      <header class="controls">
        <h2 id="roulette-title">选择职责</h2>
        <div class="rounds" aria-live="off">
          <span>本轮</span>
          <strong id="round-count">00</strong>
        </div>
      </header>

      <div class="role-tabs" role="tablist" aria-label="选择英雄职责">
        <button
          class="role-tab"
          id="tab-tank"
          type="button"
          role="tab"
          aria-selected="true"
          aria-labelledby="tab-tank-label"
          tabindex="0"
          data-role-tab="tank"
          style="--role-color: var(--tank)"
        >
          <span class="role-dot" aria-hidden="true"></span>
          <span id="tab-tank-label">重装</span>
          <span class="role-count" aria-hidden="true">15</span>
        </button>
        <button
          class="role-tab"
          id="tab-damage"
          type="button"
          role="tab"
          aria-selected="false"
          aria-labelledby="tab-damage-label"
          tabindex="-1"
          data-role-tab="damage"
          style="--role-color: var(--damage)"
        >
          <span class="role-dot" aria-hidden="true"></span>
          <span id="tab-damage-label">输出</span>
          <span class="role-count" aria-hidden="true">23</span>
        </button>
        <button
          class="role-tab"
          id="tab-support"
          type="button"
          role="tab"
          aria-selected="false"
          aria-labelledby="tab-support-label"
          tabindex="-1"
          data-role-tab="support"
          style="--role-color: var(--support)"
        >
          <span class="role-dot" aria-hidden="true"></span>
          <span id="tab-support-label">辅助</span>
          <span class="role-count" aria-hidden="true">16</span>
        </button>
      </div>

      <section
        id="panel-tank"
        role="tabpanel"
        aria-labelledby="tab-tank"
        data-role-panel="tank"
      >
        <div class="wheel-grid"></div>
        <div class="action-bar">
          <div class="combo">
            <span class="combo-label">本次组合</span>
            <strong data-combo>等待抽取</strong>
          </div>
          <button class="primary-button" type="button" data-spin-all>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M20 12a8 8 0 0 1-13.06 6.21M4 12a8 8 0 0 1 13.06-6.21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M17 3v4h-4M7 21v-4h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="12" cy="12" r="2.2" fill="currentColor"/>
            </svg>
            双盘抽取
          </button>
        </div>
      </section>

      <section
        id="panel-damage"
        role="tabpanel"
        aria-labelledby="tab-damage"
        data-role-panel="damage"
        hidden
      >
        <div class="wheel-grid"></div>
        <div class="action-bar">
          <div class="combo">
            <span class="combo-label">本次组合</span>
            <strong data-combo>等待抽取</strong>
          </div>
          <button class="primary-button" type="button" data-spin-all>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M20 12a8 8 0 0 1-13.06 6.21M4 12a8 8 0 0 1 13.06-6.21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M17 3v4h-4M7 21v-4h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="12" cy="12" r="2.2" fill="currentColor"/>
            </svg>
            双盘抽取
          </button>
        </div>
      </section>

      <section
        id="panel-support"
        role="tabpanel"
        aria-labelledby="tab-support"
        data-role-panel="support"
        hidden
      >
        <div class="wheel-grid"></div>
        <div class="action-bar">
          <div class="combo">
            <span class="combo-label">本次组合</span>
            <strong data-combo>等待抽取</strong>
          </div>
          <button class="primary-button" type="button" data-spin-all>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M20 12a8 8 0 0 1-13.06 6.21M4 12a8 8 0 0 1 13.06-6.21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M17 3v4h-4M7 21v-4h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="12" cy="12" r="2.2" fill="currentColor"/>
            </svg>
            双盘抽取
          </button>
        </div>
      </section>
    </section>
  </main>

  <footer class="site-footer">
    <p>非官方粉丝作品</p>
  </footer>

  <div class="visually-hidden" role="status" aria-live="polite" aria-atomic="true" id="live-status"></div>
  <noscript>
    <p class="noscript">此转盘需要启用 JavaScript 才能运行。</p>
  </noscript>

  <script>
    (async () => {

          seed = (entropy ^ Math.imul(seedClock, 0x9e3779b1)) >>> 0;
          attempts += 1;

          while (usedSeeds.has(seed)) {

            context.fillStyle = "rgba(255, 255, 255, 0.1)";
            context.fill();

            if (image) {
              context.save();
              context.clip();
              context.drawImage(
                image,
                -portraitRadius,
                -portraitRadius,
                portraitRadius * 2,
                portraitRadius * 2
              );
              context.restore();
            }

            context.beginPath();
            context.arc(0, 0, portraitRadius, 0, ROUND_ANGLE);
            context.strokeStyle = index === this.targetIndex
              ? (isLight ? "#18181b" : "#ffffff")
              : (isLight ? "rgba(24, 24, 27, 0.32)" : "rgba(255, 255, 255, 0.52)");
            context.lineWidth = index === this.targetIndex ? 2.4 : 1.2;
            context.stroke();
            context.restore();
          }

          context.beginPath();
          context.arc(0, 0, radius * 0.275, 0, ROUND_ANGLE);
          context.fillStyle = "rgba(24, 24, 27, 0.16)";
          context.fill();

          context.restore();

          this.canvas.setAttribute(
            "aria-label",
            `${this.role.label}职责第${this.wheelIndex + 1}个转盘，当前指向${heroName(heroes[this.targetIndex])}`
          );
        }

        updateResult(animate = true) {
          const hero = this.role.heroes[this.targetIndex];
          this.resultElement.textContent = heroName(hero);
          this.resultElement.classList.toggle("changing", animate);
          this.resultImage.src = portraitFor(hero)?.src || "";
          this.resultImage.classList.toggle("changing", animate);
        }

        async spin(seed, targetIndex) {
          if (this.spinning) {
            return;
          }

          this.spinning = true;
          this.seed = seed;
          this.targetIndex = targetIndex;
          this.resultElement.textContent = "···";
          this.resultElement.classList.add("changing");
          this.resultImage.classList.add("changing");
          this.seedElement.textContent = formatSeed(seed);

          const random = mulberry32(seed);
          const extraTurns = 5 + Math.floor(random() * 3);
          const jitter = (random() - 0.5) * this.segmentAngle * 0.62;
          const desiredRotation = normalizeAngle(-targetIndex * this.segmentAngle + jitter);
          const currentRotation = normalizeAngle(this.rotation);
          const travel = normalizeAngle(desiredRotation - currentRotation);
          const targetRotation = this.rotation + extraTurns * ROUND_ANGLE + travel;
          const duration = 2700 + Math.floor(random() * 700);

          if (REDUCED_MOTION.matches) {
            this.rotation = targetRotation;
            this.draw();
            this.finishSpin();
            return;
          }

          await new Promise((resolve) => {
            const startRotation = this.rotation;
            const startedAt = performance.now();

            const frame = (now) => {
              const progress = Math.min((now - startedAt) / duration, 1);
              this.rotation = startRotation + (targetRotation - startRotation) * easeOutQuint(progress);
              this.draw();

              if (progress < 1) {
                requestAnimationFrame(frame);
              } else {
                this.rotation = targetRotation;
                this.draw();
                this.finishSpin();
                resolve();
              }
            };

            requestAnimationFrame(frame);
          });
        }

        finishSpin() {
          this.spinning = false;
          this.updateResult(false);
        }
      }

      class RoleGroup {
        constructor(roleKey, panel) {
          this.roleKey = roleKey;
          this.role = ROLES[roleKey];
          this.panel = panel;
          this.combo = panel.querySelector("[data-combo]");
          this.spinAllButton = panel.querySelector("[data-spin-all]");
          this.wheels = [];
          this.busy = false;

          this.buildWheels();
          this.spinAllButton.addEventListener("click", () => this.spinAll());
          this.updateCombo();
        }

        buildWheels() {
          const grid = this.panel.querySelector(".wheel-grid");

          for (let wheelIndex = 0; wheelIndex < 2; wheelIndex += 1) {
            const card = document.createElement("article");
            card.className = "wheel-card";

            const header = document.createElement("header");
            header.className = "wheel-card-header";

            const title = document.createElement("div");
            title.className = "wheel-title";

            const index = document.createElement("span");
            index.className = "wheel-index";
            index.textContent = String(wheelIndex + 1).padStart(2, "0");
            index.setAttribute("aria-hidden", "true");

            const heading = document.createElement("h3");
            heading.textContent = `英雄${wheelIndex === 0 ? "一号" : "二号"}`;

            const miniButton = document.createElement("button");
            miniButton.type = "button";
            miniButton.className = "mini-spin";
            miniButton.setAttribute("aria-label", `单独重转第${wheelIndex + 1}个英雄`);
            miniButton.append(createSpinIcon(), document.createTextNode("重转"));

            title.append(index, heading);
            header.append(title, miniButton);

            const stage = document.createElement("div");
            stage.className = "wheel-stage";
            stage.style.setProperty("--role-color", this.role.color);

            const pointer = document.createElement("span");
            pointer.className = "wheel-pointer";
            pointer.setAttribute("aria-hidden", "true");

            const canvas = document.createElement("canvas");
            canvas.className = "wheel-canvas";
            canvas.setAttribute("role", "img");
            canvas.width = 480;
            canvas.height = 480;

            const hub = document.createElement("span");
            hub.className = "wheel-hub";
            hub.setAttribute("aria-hidden", "true");
            hub.innerHTML = '<span class="hub-mark"></span><span class="hub-label">RNG</span>';

            stage.append(pointer, canvas, hub);

            const resultRow = document.createElement("div");
            resultRow.className = "result-row";

            const resultHero = document.createElement("div");
            resultHero.className = "result-hero";
            resultHero.style.setProperty("--role-color", this.role.color);

            const resultAvatar = document.createElement("div");
            resultAvatar.className = "result-avatar";
            const resultImage = document.createElement("img");
            resultImage.alt = "";
            resultImage.decoding = "async";
            resultAvatar.append(resultImage);

            const resultCopy = document.createElement("div");
            resultCopy.className = "result-copy";
            const resultLabel = document.createElement("span");
            resultLabel.className = "result-kicker";
            resultLabel.textContent = "本轮英雄";
            const result = document.createElement("p");
            result.className = "hero-result";
            result.setAttribute("aria-live", "off");
            resultCopy.append(resultLabel, result);
            resultHero.append(resultAvatar, resultCopy);

            const seedBox = document.createElement("div");
            seedBox.className = "seed-box";
            const seedLabel = document.createElement("span");
            seedLabel.className = "seed-label";
            seedLabel.textContent = "SEED";
            const seed = document.createElement("code");
            seed.textContent = "READY";
            seedBox.append(seedLabel, seed);

            resultRow.append(resultHero, seedBox);
            card.append(header, stage, resultRow);
            grid.append(card);

            const wheel = new HeroWheel(
              this.roleKey,
              wheelIndex,
              canvas,
              result,
              resultImage,
              seed,
              miniButton
            );

            miniButton.addEventListener("click", () => this.spinOne(wheelIndex));
            this.wheels.push(wheel);
          }
        }

        setBusy(isBusy) {
          this.busy = isBusy;
          this.spinAllButton.disabled = isBusy;
          this.spinAllButton.setAttribute("aria-busy", String(isBusy));

          for (const wheel of this.wheels) {
            wheel.miniButton.disabled = isBusy;
            wheel.miniButton.closest(".wheel-card").classList.toggle("is-spinning", isBusy);
          }
        }

        updateCombo() {
          const heroes = this.wheels.map((wheel) => this.role.heroes[wheel.targetIndex]);
          this.combo.textContent = `${heroName(heroes[0])} × ${heroName(heroes[1])}`;
        }

        async spinAll() {
          if (this.busy) {
            return;
          }

          this.setBusy(true);
          liveStatus.textContent = `${this.role.label}转盘正在旋转`;

          const seeds = [createSeed(), createSeed()];
          const firstRandom = mulberry32(seeds[0]);
          const secondRandom = mulberry32(seeds[1]);
          const firstIndex = chooseIndex(firstRandom, this.role.heroes.length);
          const secondIndex = chooseIndex(secondRandom, this.role.heroes.length, firstIndex);

          round += 1;
          roundCount.textContent = String(round).padStart(2, "0");

          await Promise.all([
            this.wheels[0].spin(seeds[0], firstIndex),
            this.wheels[1].spin(seeds[1], secondIndex)
          ]);

          this.finishRound();
        }

        async spinOne(wheelIndex) {
          if (this.busy) {
            return;
          }

          const wheel = this.wheels[wheelIndex];
          const otherWheel = this.wheels[wheelIndex === 0 ? 1 : 0];
          const seed = createSeed();
          const random = mulberry32(seed);
          const targetIndex = chooseIndex(random, this.role.heroes.length, otherWheel.targetIndex);

          this.setBusy(true);
          circleWheelBusy(this, wheelIndex);
          liveStatus.textContent = `${this.role.label}第${wheelIndex + 1}个转盘正在旋转`;

          round += 1;
          roundCount.textContent = String(round).padStart(2, "0");

          await wheel.spin(seed, targetIndex);
          this.finishRound();
        }

        finishRound() {
          this.setBusy(false);
          this.updateCombo();
          const [first, second] = this.wheels.map(
            (wheel) => this.role.heroes[wheel.targetIndex]
          );
          liveStatus.textContent = `${this.role.label}职责抽取完成：${heroName(first)}和${heroName(second)}`;
        }
      }

      function circleWheelBusy(group, activeWheelIndex) {
        for (const wheel of group.wheels) {
          wheel.miniButton.closest(".wheel-card").classList.toggle(
            "is-spinning",
            wheel.wheelIndex === activeWheelIndex
          );
        }
      }

      const groups = {};

      await preloadHeroPortraits();

      for (const roleKey of ROLE_ORDER) {
        const panel = document.querySelector(`[data-role-panel="${roleKey}"]`);
        groups[roleKey] = new RoleGroup(roleKey, panel);
      }

      const tabs = Array.from(document.querySelectorAll("[data-role-tab]"));

      function selectRole(roleKey, options = {}) {
        for (const tab of tabs) {
          const selected = tab.dataset.roleTab === roleKey;
          tab.setAttribute("aria-selected", String(selected));
          tab.tabIndex = selected ? 0 : -1;

          const panel = document.querySelector(`[data-role-panel="${tab.dataset.roleTab}"]`);
          panel.hidden = !selected;
        }

        if (options.focus) {
          document.querySelector(`[data-role-tab="${roleKey}"]`).focus();
        }

        requestAnimationFrame(() => {
          for (const wheel of groups[roleKey].wheels) {
            wheel.resize();
          }
        });
      }

      for (const tab of tabs) {
        tab.addEventListener("click", () => selectRole(tab.dataset.roleTab));

        tab.addEventListener("keydown", (event) => {
          const currentIndex = tabs.indexOf(tab);
          let nextIndex = null;

          if (event.key === "ArrowRight") {
            nextIndex = (currentIndex + 1) % tabs.length;
          } else if (event.key === "ArrowLeft") {
            nextIndex = (currentIndex - 1 + tabs.length) % tabs.length;
          } else if (event.key === "Home") {
            nextIndex = 0;
          } else if (event.key === "End") {
            nextIndex = tabs.length - 1;
          }

          if (nextIndex !== null) {
            event.preventDefault();
            selectRole(tabs[nextIndex].dataset.roleTab, { focus: true });
          }
        });
      }

      selectRole("tank");
    })();
  </script>
